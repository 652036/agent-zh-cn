name: 一次性发布 v2.1.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release v2.1.0]')
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行测试与质量检查
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_locale_quality.py
          python scripts/build_js.py --check
          node --check agent-zh.js
          node tests/runtime.test.cjs

      - name: 组装 Windows 完整包
        shell: pwsh
        run: |
          $root = Join-Path $PWD "release/AgentZh"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root "locales") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root "src") | Out-Null

          Copy-Item AgentZh.ps1,agent_zh.py,agent-zh.js,AgentZh-Installer.bat,一键汉化.bat,取消汉化.bat,README.md,LICENSE $root
          Copy-Item src/apps.json (Join-Path $root "src/apps.json")
          Copy-Item locales/zh-CN.json,locales/common.json,locales/devin-nls.json (Join-Path $root "locales")

          Compress-Archive -Path "$root/*" -DestinationPath "AgentZh-Windows.zip" -CompressionLevel Optimal -Force

          $files = @("AgentZh-Windows.zip", "AgentZh-Installer.bat")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: 发布 v2.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: AgentZh v2.1.0
          target_commitish: main
          generate_release_notes: true
          files: |
            AgentZh-Windows.zip
            AgentZh-Installer.bat
            SHA256SUMS.txt
